[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shutdowns"
dynamic = ["version"]
description = "Internet shutdowns and the GitHub activity attributed to a country, with synthetic control methods"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Matin Nikoomanzar"}]
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "pandas", "duckdb", "matplotlib", "pycountry"]

[project.scripts]
shutdowns = "shutdowns.cli:main"

[tool.setuptools]
packages = ["shutdowns"]

[tool.setuptools.dynamic]
version = {attr = "shutdowns.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes more than a few seconds"]
