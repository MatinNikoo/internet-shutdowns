name: tests

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt && pip install -e .
      - run: python -m pytest -q
      - name: registry check
        run: shutdowns validate
      - name: one event end to end
        run: shutdowns estimate --event IR-2026 --no-files
